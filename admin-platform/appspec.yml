version: 0.0
os: windows
files:
  - source: app.py
    destination: C:\admin-platform
  - source: wearable_engine.py
    destination: C:\admin-platform
  - source: templates
    destination: C:\admin-platform\templates
  - source: static
    destination: C:\admin-platform\static
file_exists_behavior: OVERWRITE
hooks:
  ApplicationStop:
    - location: scripts\stop_app.ps1
      timeout: 30
  BeforeInstall:
    - location: scripts\before_install.ps1
      timeout: 30
  AfterInstall:
    - location: scripts\after_install.ps1
      timeout: 60
